name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
      - name: Build (fails if any contract exceeds EIP-170)
        run: forge build --sizes
      - name: EIP-170 headroom >= 1 KB for every deployable contract
        run: python3 script/ci/code-size.py
      - name: Storage layouts of the upgradeable contracts are unchanged (contracts/layout/)
        run: script/ci/storage-layout.sh check
      - name: Test
        run: forge test -vv
      - name: Privileged functions are all listed (PRIV-1/2)
        run: python3 script/ci/privileged-functions.py check
      - name: Deployment verification script (offline test)
        run: script/ci/verify-deployment.test.sh

  # TEST-2: the deep stateful run (>= 100k handler calls per invariant). Slow, so it runs on every push to main, not on PRs.
  invariants-deep:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
      - name: Deep invariants (FOUNDRY_PROFILE=deep, 500 runs x 200 calls)
        run: contracts/script/ci/deep-invariants.sh

  # TEST-5: line and branch coverage of contracts/src. --ir-minimum avoids stack-too-deep under coverage instrumentation.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
      - name: Coverage summary
        # Gas-bound tests are skipped (instrumented code costs more gas, so they would fail here and pass in the contracts job);
        # the fuzz seed is fixed so the report is reproducible.
        run: >-
          forge coverage --ir-minimum --no-match-path 'test/fork/*' --no-match-test '[gG]as' --fuzz-seed 0x5eed
          --report summary --report lcov --report-file lcov.info | tee coverage-summary.txt
      - name: Add summary to the run page
        run: |
          { echo '### Contract coverage'; echo '```'; grep -E '^\| *(src/|File|Total)' coverage-summary.txt || tail -40 coverage-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contracts-lcov
          path: contracts/lcov.info
          retention-days: 30

  slither:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Slither (fails on High)
        run: contracts/script/ci/slither.sh

  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    services:
      # The database tests create one throwaway database per test file on this server. It is the same TimescaleDB
      # image family production uses, so the hypertable and continuous-aggregate migrations run for real.
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test (against TimescaleDB)
        run: bun test

  vol-engine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vol-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vol-engine/pyproject.toml
      # The anvil end-to-end test needs anvil, cast and the VolOracle build output; without them it skips.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
      - name: Build VolOracle for the anvil test
        working-directory: contracts
        run: forge build src/VolOracle.sol
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q

  copy-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install (frozen lockfile)
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Copy lint (website, docs, API and tool descriptions)
        working-directory: app
        run: bun run lint:copy

  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exact pins, frozen installs, release-age guards
        run: .github/scripts/check-deps.sh

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: README deployment status matches app/deployments (DOC-6)
        run: |
          .github/scripts/check-readme-deployment.test.sh
          .github/scripts/check-readme-deployment.py

  semgrep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (fails on WARNING or ERROR)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep@sha256:4372a1de903521f9f10f877b6caf15d150d17e1ca592582682c8d02b77cbd4f6
          semgrep scan --config r/solidity --config p/typescript --config p/secrets
          --exclude contracts/lib --exclude node_modules
          --severity WARNING --severity ERROR --error --metrics off

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git --no-banner --redact --config .githooks/gitleaks.toml .
