[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vol-engine"
version = "0.1.0"
description = "Volatility engine: computes sigma per name and speed, signs EIP-712 posts for VolOracle"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "eth-account>=0.11",
  "psycopg[binary]>=3.1",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vol-engine = "vol_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
